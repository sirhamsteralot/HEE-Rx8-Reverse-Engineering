# tinyproxy configuration: default-deny egress with a hostname allowlist.
# allowlist.txt holds one extended-regex per permitted destination host.
Port 8888
Listen 0.0.0.0
Timeout 600

# Only the agent container sits on this network.
Allow 172.16.0.0/12

Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
FilterExtended On

# HTTPS only: everything else is refused, so git-over-ssh and raw TCP egress
# have no path out.
ConnectPort 443
ConnectPort 563

DisableViaHeader Yes
LogLevel Info
# tmpfs path: the egress container runs a read-only root filesystem.
LogFile "/tmp/tinyproxy.log"
PidFile "/tmp/tinyproxy.pid"
MaxClients 40
