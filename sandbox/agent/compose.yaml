# Agent box for this repo: an AI coding agent runs inside the `agent` container,
# which has no host Docker socket, no host home directory, no route off the
# machine except the `egress` proxy, and works directly in a mount of this repo.
#
#   docker compose up -d egress            # allowlisting proxy (default deny)
#   docker compose run --rm agent          # shell in the box
#   docker compose run --rm agent vibe     # the agent CLI
#
# The working tree is bind-mounted at /work/repo, i.e. the box edits this
# checkout in place and there is no copy to extract afterwards. Point REPO_PATH
# at a scratch clone if the primary checkout should not be writable from the
# box; see README.md for what that costs and what it does not protect.
name: hee-agent-box

services:
  egress:
    build:
      context: .
      target: egress
    image: hee-agent-box-egress:latest
    restart: unless-stopped
    user: tinyproxy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks:
      - sandbox
      - upstream

  agent:
    build:
      context: .
      target: agent
      args:
        # Switch the agent CLI without touching the boundary: AGENT=none gives
        # the same hardened box with no agent installed.
        AGENT: ${AGENT:-vibe}
        VIBE_VERSION: ${VIBE_VERSION:-3.1.4}
    image: hee-agent-box:latest
    depends_on:
      - egress
    init: true
    networks:
      - sandbox
    environment:
      # The only egress path; tinyproxy denies anything outside allowlist.txt.
      HTTP_PROXY: http://egress:8888
      HTTPS_PROXY: http://egress:8888
      http_proxy: http://egress:8888
      https_proxy: http://egress:8888
      no_proxy: localhost,127.0.0.1
      # No browser in the box: point every opener at the stub that prints the
      # URL for the host instead (see xdg-open.sh). Without it, the CLI's
      # browser sign-in fails on the box side before it starts polling.
      BROWSER: xdg-open
    # Model credentials: put MISTRAL_API_KEY in an untracked sandbox/agent/.env
    # (`.env` is already gitignored) instead of exporting it in your shell.
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
      - /run:size=64m
    volumes:
      # The repo's working tree itself, mounted read-write: writes inside the box
      # land in this checkout. Override with REPO_PATH for another checkout (for
      # example a scratch clone) — the only host path the box sees either way.
      - ${REPO_PATH:-../..}:/work/repo
      # Agent state: config, sessions, skills caches. The repo is not copied here.
      - agent-home:/home/agent
    # The privileged caps exist only for the root bootstrap (chown of the home
    # volume + gosu); nothing else in the box runs with capabilities. The repo
    # mount keeps the host's user and group ids and is never chowned here.
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 2048
    mem_limit: ${AGENT_MEMORY:-8g}
    cpus: ${AGENT_CPUS:-8}
    stdin_open: true
    tty: true

networks:
  # No gateway: only the egress proxy is reachable from here.
  sandbox:
    internal: true
  upstream:

volumes:
  agent-home:
