[project]
name = "hee-workflows"
version = "0.1.0"
description = "Mistral Workflows worker for the HEE RX-8 reverse-engineering repo"
requires-python = ">=3.12"
dependencies = [
    "mistralai>=3.4.0",
    "mistralai-workflows>=3.19.0",
    "httpx>=0.27.0",
    "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]
